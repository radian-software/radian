name: CI
on:
  push:
    branches: [master, develop]
  pull_request: {}
jobs:
  ci:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        emacs_version: [29, 30, 31]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: CI
        env:
          VERSION: ${{ matrix.emacs_version }}
        run: >-
          make docker CMD="make -k link lint"
